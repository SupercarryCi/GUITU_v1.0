<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#475569"/></marker></defs>
<rect width="1280" height="720" fill="#F8FAFC"/>
<text x="52" y="58" font-family="Microsoft YaHei, SimHei, Arial" font-size="34" font-weight="700" fill="#0F172A" text-anchor="start">系统数据流总览</text>
<text x="54" y="88" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">面向演示的简化数据流：外设输入经过任务处理，统一进入全局状态，再输出到显示、返航、LoRa和报警。</text>
<rect x="240" y="106" width="800" height="42" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="640" y="133" font-family="Microsoft YaHei, SimHei, Arial" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">初始化通过  →  创建队列/事件/任务  →  启动 FreeRTOS 调度</text>
<rect x="52" y="176" width="190" height="370" rx="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="147.0" y="207" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#0EA5E9" text-anchor="middle">外设输入</text>
<rect x="70" y="228" width="154" height="43" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/><text x="147.0" y="254.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">IMU数据</text>
<rect x="70" y="283" width="154" height="43" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/><text x="147.0" y="309.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">气体采样</text>
<rect x="70" y="338" width="154" height="43" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/><text x="147.0" y="364.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">血氧数据</text>
<rect x="70" y="393" width="154" height="43" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/><text x="147.0" y="419.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">触摸输入</text>
<rect x="70" y="448" width="154" height="43" rx="9" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/><text x="147.0" y="474.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">LoRa接收</text>
<rect x="294" y="176" width="204" height="370" rx="16" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="396.0" y="207" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#8B5CF6" text-anchor="middle">任务处理</text>
<rect x="312" y="228" width="168" height="43" rx="9" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="396.0" y="254.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">姿态与步态</text>
<rect x="312" y="283" width="168" height="43" rx="9" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="396.0" y="309.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">ADC气体处理</text>
<rect x="312" y="338" width="168" height="43" rx="9" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="396.0" y="364.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">血氧任务</text>
<rect x="312" y="393" width="168" height="43" rx="9" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="396.0" y="419.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">UI任务</text>
<rect x="312" y="448" width="168" height="43" rx="9" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.5"/><text x="396.0" y="474.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">LoRa任务</text>
<rect x="552" y="220" width="300" height="145" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
<text x="702" y="262" font-family="Microsoft YaHei, SimHei, Arial" font-size="22" font-weight="700" fill="#F97316" text-anchor="middle">控制中心 / 全局状态</text>
<text x="702" y="310" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="400" fill="#0F172A" text-anchor="middle">累计位置、航向和环境数据</text>
<text x="702" y="333" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="400" fill="#0F172A" text-anchor="middle">分发用户命令与返航状态</text>
<rect x="566" y="424" width="272" height="90" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="702" y="463" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">返航建图与路径引导</text>
<text x="702" y="494" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" font-weight="400" fill="#0F172A" text-anchor="middle">根据历史路径生成方向和距离</text>
<rect x="906" y="176" width="218" height="370" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
<text x="1015.0" y="207" font-family="Microsoft YaHei, SimHei, Arial" font-size="20" font-weight="700" fill="#EF4444" text-anchor="middle">输出与反馈</text>
<rect x="924" y="228" width="182" height="43" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="1015.0" y="254.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">主界面显示</text>
<rect x="924" y="283" width="182" height="43" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="1015.0" y="309.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">返航引导</text>
<rect x="924" y="338" width="182" height="43" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="1015.0" y="364.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">LoRa上报</text>
<rect x="924" y="393" width="182" height="43" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="1015.0" y="419.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">蜂鸣器报警</text>
<rect x="924" y="448" width="182" height="43" rx="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/><text x="1015.0" y="474.5" font-family="Microsoft YaHei, SimHei, Arial" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">调试串口</text>
<line x1="242" y1="361" x2="294" y2="361" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="498" y1="361" x2="552" y2="292" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="852" y1="292" x2="906" y2="361" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="704" y1="365" x2="704" y2="424" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="838" y1="469" x2="906" y2="414" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="640" y="612" font-family="Microsoft YaHei, SimHei, Arial" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle">主数据流：外设采集 → 任务处理 → 控制中心/全局状态 → UI显示、返航引导、LoRa上报、蜂鸣器报警</text>
<text x="640" y="663" font-family="Microsoft YaHei, SimHei, Arial" font-size="15" font-weight="400" fill="#64748B" text-anchor="middle">RTOS队列、事件标志和互斥保护作为内部同步机制，图中不再展开，避免影响讲解清晰度。</text>
</svg>